version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: hopscot_postgres
    restart: always
    environment:
      POSTGRES_USER: hopscot_user
      POSTGRES_PASSWORD: hopscot_secret_password
      POSTGRES_DB: hopscot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hopscot_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://hopscot_user:hopscot_secret_password@db:5432/hopscot_db
      SECRET_KEY: hopscot_super_jwt_secret_key_demo
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hopscot_frontend
    restart: always
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
